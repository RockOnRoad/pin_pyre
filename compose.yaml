services:
  db-api:
    env_file:
      - ./db_api/.env.dev
    build:
      context: ./db_api
      dockerfile: Dockerfile
    image: pin-pyre-db-api:local
    environment:
      PORT: "8080"
      DB_PATH: "/app/data/tyres.db"
      # Add public client IPs here if this is exposed beyond local/private networks.
      # ALLOWED_IPS: "203.0.113.10,198.51.100.25"
    # The SQLite DB file lives on a dedicated host bind mount so image rebuilds
    # never touch persisted data. Running as root avoids host/container UID
    # mismatches that prevent SQLite from creating journal files.
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./db_api/data:/app/data
    restart: unless-stopped

  app:
    build:
      context: ./website
      dockerfile: Dockerfile
    command: python client.py
    depends_on:
      - db-api